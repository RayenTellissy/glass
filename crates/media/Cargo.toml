[package]
name = "media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
codec-av1 = []
codec-prores-sw = []

# Criterion benches take their own command-line flags, which the libtest harness of the
# library target would reject under `cargo bench`.
[lib]
bench = false

[dependencies]
assets.workspace = true
ffmpeg-next.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation.workspace = true
objc2-core-video.workspace = true
objc2-io-surface.workspace = true

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true
criterion.workspace = true

[[bench]]
name = "probe"
harness = false

[[bench]]
name = "decode"
harness = false

[lints]
workspace = true
