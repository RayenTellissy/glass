[package]
name = "project"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Criterion benches take their own command-line flags, which the libtest harness of the
# library target would reject under `cargo bench`.
[lib]
bench = false

[dependencies]
imbl.workspace = true
serde = { workspace = true, features = ["rc"] }
# Exact float parsing, so a saved project loads and saves again to the same bytes.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "media_pool"
harness = false

[lints]
workspace = true
