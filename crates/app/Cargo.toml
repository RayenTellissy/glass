[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
authors.workspace = true
description = "Glass, a fast native video editor"

# Only the `glass` binary ships; every other crate stays out of the release.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "C30C6E25-405F-40E7-A9E1-2FDF86517D3C"
path-guid = "B0EB980E-99BF-4636-AF4D-86B444F87100"
license = false
eula = false

[[bin]]
name = "glass"
path = "src/main.rs"

[features]
default = []
codec-av1 = ["engine/codec-av1"]
codec-prores-sw = ["engine/codec-prores-sw"]
ai-whisper = ["engine/ai-whisper"]
ai-segmentation = ["engine/ai-segmentation"]
# Every optional feature. Release builds pass `--features release-full`.
release-full = ["codec-av1", "codec-prores-sw", "ai-whisper", "ai-segmentation"]

[dependencies]
engine.workspace = true
ui.workspace = true
crash-handler.workspace = true
minidumper.workspace = true
dirs.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
pollster.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[lints]
workspace = true
