[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Glass contributors"]
publish = false
# Placeholder until the GitHub remote exists; dist needs it to generate the release workflow.
repository = "https://github.com/OWNER/glass"

[workspace.dependencies]
assets = { path = "crates/assets" }
audio = { path = "crates/audio" }
engine = { path = "crates/engine" }
media = { path = "crates/media" }
plugins = { path = "crates/plugins" }
project = { path = "crates/project" }
render = { path = "crates/render" }
ui = { path = "crates/ui" }

serde = { version = "1", features = ["derive"] }
thiserror = "2"
# Persistent collections with structural sharing for the edit tree (`project`): imbl, the
# maintained fork of `im` (which is unmaintained and has an unsoundness advisory).
imbl = { version = "7", features = ["serde"] }

# FFmpeg 9.0.x through ffmpeg-next 9, linked as shared libraries found through FFMPEG_DIR
# (scripts/dev-env.sh). Only `media` uses it; raw FFmpeg calls stay in `media::ffi`.
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling"] }
serde_json = "1"
# Content hashes for the project cache folder (`media::cache`).
blake3 = "1"
# Still images and animations (`media::source`): only the formats Glass imports. HEIC and
# AVIF come from ImageIO on macOS.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "tiff", "bmp"] }
# The decoders behind `image`'s GIF and WebP support, used directly for animations: their
# decoders are `Send`, so an animation can live on a decode-pool thread between frames.
gif = "0.14"
image-webp = "0.2"
# Audio sample-rate conversion (`media::audio`): the asynchronous sinc resampler only, so
# the FFT resampler's dependencies stay out; audioadapter-buffers wraps planar buffers.
rubato = { version = "5", default-features = false }
audioadapter-buffers = { version = "5.1", default-features = false, features = ["std"] }

# GPU: the wgpu version egui-wgpu 0.36 uses, so `render` shares eframe's device.
wgpu = "30"
# Text (`render::text`): cosmic-text shapes and lays out (bidi, font fallback, system fonts
# through fontdb); swash, which cosmic-text already uses, rasterises fills and outline
# strokes. fontconfig stays off: fontdb scans the standard font folders itself.
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
swash = "0.2"
# Shader hot reload in debug builds (`render::shaders`): naga validates an edited shader
# before its pipelines rebuild (the naga version wgpu 30 uses) and notify watches the
# shader folder. Cargo cannot gate dependencies on the build profile, so both are always
# built; the watcher code itself is compiled only with debug assertions.
naga = { version = "30", features = ["wgsl-in"] }
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# macOS platform bindings for hardware decode (`media::ffi`) and IOSurface import into
# Metal (`render::interop`); the same versions wgpu-hal uses.
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn", "objc2-io-surface"] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageSource", "CGImageProperties", "objc2-core-graphics"] }
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes", "objc2-io-surface"] }

# UI: egui on wgpu, the versions proto-ui measured. `default_fonts` stays off because
# it bundles the Ubuntu font, which deny.toml rejects; Glass ships Geist and Geist Mono
# (OFL) from assets/fonts/ instead. eframe joins `app` with the window.
egui = { version = "0.36", default-features = false }
egui-wgpu = "0.36"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "wgpu", "wayland", "x11"] }
pollster = "0.4"
# The system file picker for importing (`ui::panels::file_dialog`), used asynchronously.
rfd = "0.17"
tracing = "0.1"
# `tracing-log` routes `log` records (wgpu, winit, eframe) into tracing.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "tracing-log", "smallvec"] }

# Opt-in local crash reports: an in-process handler and an out-of-process minidump
# writer (EmbarkStudios). Local IPC only, no network.
crash-handler = "0.8"
minidumper = "0.11"
dirs = "7"

# Benchmarks only (dev-dependency). Plots and rayon are left out: CI reads the JSON
# estimates, and benchmarks run one at a time anyway.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Property tests only (dev-dependency).
proptest = { version = "1", default-features = false, features = ["std"] }

# Line tables keep backtraces useful while saving disk; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Tests hash whole decoded 4K frames; unoptimised BLAKE3 would dominate their run time.
[profile.dev.package.blake3]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
# A crate that must call platform APIs keeps that code in one `ffi`, `sys` or
# `interop` module with a local #[allow(unsafe_code)] (docs/ARCHITECTURE.md).
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
