[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["experiments"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
assets = { path = "crates/assets" }
audio = { path = "crates/audio" }
engine = { path = "crates/engine" }
media = { path = "crates/media" }
plugins = { path = "crates/plugins" }
project = { path = "crates/project" }
render = { path = "crates/render" }
ui = { path = "crates/ui" }

# Line tables keep backtraces useful while saving disk; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.lints.rust]
# Allowed locally only in media::ffi and render::interop (docs/ARCHITECTURE.md).
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
