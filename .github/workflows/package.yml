# Formats dist does not produce: a DMG per macOS target, an MSIX for Windows and an
# AppImage for Linux, plus the GPL source bundle. release.yml (generated by dist)
# calls this as a local-artifacts job (`local-artifacts-jobs` in dist-workspace.toml);
# every `artifacts-*` upload here is attached to the GitHub Release with dist's own
# archives and MSI.
name: Package

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            script: make-dmg.sh
          - os: macos-13
            target: x86_64-apple-darwin
            script: make-dmg.sh
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            script: make-msix.sh
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            script: make-appimage.sh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Same FFmpeg steps as ci.yml and .github/build-setup.yml.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            .glass-cache/ffmpeg/src
            .glass-cache/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg/versions.env', 'scripts/ffmpeg/build.sh') }}

      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake libva-dev zlib1g-dev patchelf
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"

      - name: FFmpeg build prerequisites (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils tar bzip2 xz nasm pkgconf

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build FFmpeg (macOS, Linux)
        if: runner.os != 'Windows'
        run: scripts/ffmpeg/build.sh --jobs 4

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2's coreutils link.exe would shadow the MSVC linker.
          rm -f /usr/bin/link.exe
          scripts/ffmpeg/build.sh --jobs 4

      - name: Use the pinned FFmpeg
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/.glass-cache/ffmpeg/${{ matrix.target }}"
          cat "$prefix/BUILDINFO"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux) echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV" ;;
            Windows) echo "$prefix/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Build glass
        shell: bash
        run: cargo build --locked --profile dist --features release-full -p app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/dist/glass
          [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          args=(--binary "$exe" --out target/package/${{ matrix.target }})
          [ "$RUNNER_OS" = macOS ] && args+=(--target ${{ matrix.target }})
          scripts/package/${{ matrix.script }} "${args[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-package-${{ matrix.target }}
          path: |
            target/package/${{ matrix.target }}/*.dmg
            target/package/${{ matrix.target }}/*.msix
            target/package/${{ matrix.target }}/*.AppImage
          if-no-files-found: error

  # GPL: every release carries the exact FFmpeg, x264 and x265 sources it was built from.
  ffmpeg-sources:
    name: FFmpeg release sources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Package sources
        run: |
          scripts/ffmpeg/package-sources.sh --archive
          mkdir -p target/package
          mv .glass-cache/ffmpeg/release-sources.tar.gz "target/package/glass-${GITHUB_REF_NAME}-ffmpeg-sources.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-ffmpeg-sources
          path: target/package/*-ffmpeg-sources.tar.gz
          if-no-files-found: error
