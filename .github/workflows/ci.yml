name: CI

on:
  push:
    branches: ["main", "goal/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Static FFmpeg command-line tools used only to generate the reference media on Linux
  # (it needs libvpx and SVT-AV1, which the pinned library build leaves out).
  BTBN_TAG: "autobuild-2026-09-28-13-06"
  BTBN_VERSION: "n9.0.2-14-gebafaee10a"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The pinned FFmpeg libraries from scripts/ffmpeg/build.sh, rebuilt only when the
      # pinned versions or the script change.
      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            .glass-cache/ffmpeg/src
            .glass-cache/ffmpeg/${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg/versions.env', 'scripts/ffmpeg/build.sh') }}

      - name: Build prerequisites (macOS)
        if: runner.os == 'macOS'
        # Homebrew's FFmpeg supplies only the command-line tools for the reference media;
        # nasm is built by the script when it is missing.
        run: brew install ffmpeg

      - name: Build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm cmake libva-dev zlib1g-dev clang libclang-dev
          name="ffmpeg-${BTBN_VERSION}-linux64-gpl-9.0"
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg-cli.tar.xz" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_TAG}/${name}.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg-cli.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name/bin" >> "$GITHUB_PATH"

      - name: Build prerequisites (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          path-type: inherit
          install: make diffutils tar bzip2 xz nasm pkgconf

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build FFmpeg (macOS, Linux)
        if: runner.os != 'Windows'
        run: scripts/ffmpeg/build.sh --jobs 4

      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          # MSYS2's coreutils link.exe would shadow the MSVC linker.
          rm -f /usr/bin/link.exe
          scripts/ffmpeg/build.sh --jobs 4

      - name: Use the pinned FFmpeg
        shell: bash
        run: |
          prefix="$GITHUB_WORKSPACE/.glass-cache/ffmpeg/${{ matrix.target }}"
          cat "$prefix/BUILDINFO"
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          case "$RUNNER_OS" in
            Linux) echo "LD_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV" ;;
            Windows) echo "$prefix/bin" >> "$GITHUB_PATH" ;;
          esac

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Reference media
        if: runner.os != 'Windows'
        run: tests/fixtures/generate.sh --verify

      - name: Test
        run: cargo test --workspace

      - name: Smoke
        run: cargo run --bin smoke

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

# Tagged releases (installers and the GPL source bundle) are built by release.yml,
# which dist generates, and package.yml.
