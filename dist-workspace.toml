[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["msi"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Build the `glass` binary with every optional feature, one package at a time
# (only `app` is dist-able, and the other crates have no `release-full`).
features = ["release-full"]
precise-builds = true
# Steps run in each build job before `dist build`: the pinned FFmpeg for the
# target, plus the WiX fragment that puts its DLLs and licences in the MSI.
github-build-setup = "../build-setup.yml"
# Jobs that build the formats dist does not produce (DMG, MSIX, AppImage)
# alongside dist's own builds; their `artifacts-*` uploads join the release.
local-artifacts-jobs = ["./package"]
# main.wxs is edited by hand (product name, FFmpeg DLLs, licences).
allow-dirty = ["msi"]
